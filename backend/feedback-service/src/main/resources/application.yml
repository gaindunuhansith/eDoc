spring:
  application:
    name: feedback-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5442}/${DB_NAME:feedback_db}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:public.pem}

# Service URLs - following patient service pattern
appointment:
  service:
    url: ${APPOINTMENT_SERVICE_URL:http://appointment-service:8081}
notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8083}
user:
  service:
    url: ${USER_SERVICE_URL:http://user-service:8088}
patient:
  service:
    url: ${PATIENT_SERVICE_URL:http://patient-service:8084}
doctor:
  service:
    url: ${DOCTOR_SERVICE_URL:http://doctor-service:8082}

server:
  port: ${SERVER_PORT:8089}

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:secrets/public.pem}
  public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}

